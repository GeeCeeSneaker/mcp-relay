name: local-adapter

# AT-LOCAL on real Windows and Linux runners: the node capability server
# (node-runtime/server.mjs) exercised by the project smoke client in both MCP
# protocol generations, plus a compile check of the Windows tray app.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  at-local:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned runtime and test client
        run: |
          npm ci --prefix node-runtime --no-fund --no-audit
          npm ci --prefix tests --no-fund --no-audit
      - name: Start capability server
        run: |
          # Fresh random bearer token per run; exported for the smoke step.
          token=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          echo "::add-mask::$token"
          echo "MCPRELAY_BRIDGE_TOKEN=$token" >> "$GITHUB_ENV"
          export MCPRELAY_BRIDGE_TOKEN=$token
          # Audit log inside the default root (home) with a small cap so CI exercises rotation.
          if [ "$RUNNER_OS" = "Windows" ]; then export MCPRELAY_AUDIT_LOG="$(cygpath -w "$HOME")\\mcprelay-audit\\audit.log"
          else export MCPRELAY_AUDIT_LOG="$HOME/mcprelay-audit/audit.log"; fi
          export MCPRELAY_AUDIT_MAX_BYTES=16384 MCPRELAY_NODE_NAME=ci
          # Extra guard folders inside the root, so the smoke suite exercises both guard lists.
          if [ "$RUNNER_OS" = "Windows" ]; then g="$(cygpath -w "$HOME")\\mcprelay-guard"; export MCPRELAY_PROTECTED_DIRS="$g\\prot" MCPRELAY_READONLY_DIRS="$g\\ro"
          else g="$HOME/mcprelay-guard"; export MCPRELAY_PROTECTED_DIRS="$g/prot" MCPRELAY_READONLY_DIRS="$g/ro"; fi
          node node-runtime/server.mjs --port 18001 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18001/healthz && exit 0
            sleep 1
          done
          cat server.log; exit 1
      - name: Smoke test (AT-LOCAL, both protocol eras)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            FIXTURE="$(cygpath -w "$HOME")\\mcprelay-fixture"; OSNAME=windows
          else
            FIXTURE="$HOME/mcprelay-fixture"; OSNAME=linux
          fi
          for era in legacy modern; do
            echo "== protocol era: $era"
            node tests/mcp-smoke.mjs --url http://127.0.0.1:18001/mcp --fixture "$FIXTURE" --os "$OSNAME" --token-env MCPRELAY_BRIDGE_TOKEN --era "$era" --destructive-ok
          done
      - name: Extended checks (Windows)
        if: runner.os == 'Windows'
        run: |
          node tests/compare-ext.mjs --url http://127.0.0.1:18001/mcp --token-env MCPRELAY_BRIDGE_TOKEN --fixture "$(cygpath -w "$HOME")\\mcprelay-ext"
      - name: Listener must be loopback-only
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            netstat -ano | grep ':18001 .*LISTENING'
            ! netstat -ano | grep ':18001 .*LISTENING' | grep -v '127.0.0.1:18001'
          else
            ss -ltn | grep ':18001'
            ! ss -ltn | grep ':18001' | grep -v '127.0.0.1:18001'
          fi
      - name: Build Windows tray app (built-in .NET Framework csc)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /out:MCPRelay.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll app\windows\MCPRelay.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Server log
        if: always()
        run: cat server.log || true
