# MCPRelay gateway (M3) — R0Wi/mcp-gateway. Rendered by scripts/vps-install.sh
# into /etc/mcprelay/gateway.yaml; placeholders in <angle brackets>.
server:
  public_url: https://<mcp-domain>
  host: 127.0.0.1            # loopback only; Caddy (M4) is the public edge
  port: 18000
  trusted_proxy_ips: 127.0.0.1

auth:
  # Key file generated on the host (never in Git), read via MCP_GATEWAY_ENCRYPTION_KEY_FILE.
  encryption_key: ${MCP_GATEWAY_ENCRYPTION_KEY:-}
  users:
    - username: <gateway-user>
      password_hash: "<bcrypt-hash>"
  access_token_expiry_seconds: 3600
  refresh_token_expiry_seconds: 2592000
  login_session_expiry_seconds: 28800
  # Only these OAuth clients may register redirect URIs via DCR.
  allowed_client_redirect_uris:
    - "https://chatgpt.com/connector/oauth/*"
    - "https://chatgpt.com/connector_platform_oauth_redirect"
    - "https://claude.ai/api/mcp/auth_callback"
    - "https://claude.com/api/mcp/auth_callback"
    - "http://localhost:*/callback"
    - "http://127.0.0.1:*/callback"

storage:
  path: /var/lib/mcprelay/gateway.db

# One backend per node; tools are exposed as <node>_<tool> (M9).
# Each node's reverse tunnel listens on VPS loopback at its own port.
backends:
<backends>
