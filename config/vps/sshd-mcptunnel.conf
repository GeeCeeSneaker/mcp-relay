# MCPRelay reverse-tunnel account (M2). Appended to the END of
# /etc/ssh/sshd_config by scripts/vps-install.sh (Match blocks must be last).
# The account can only create remote (-R) forwards; per-key permitlisten in
# authorized_keys pins each node to its own loopback port.
Match User mcptunnel
	AllowTcpForwarding remote
	GatewayPorts no
	AllowAgentForwarding no
	AllowStreamLocalForwarding no
	X11Forwarding no
	PermitTTY no
	PasswordAuthentication no
	ClientAliveInterval 10
	ClientAliveCountMax 3
	ForceCommand /sbin/nologin
